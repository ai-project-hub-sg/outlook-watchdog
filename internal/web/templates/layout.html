{{define "head"}}<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · outlook-watchdog</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<script>/* 首访自动写入浏览器时区 cookie 并刷新一次（服务端按 cookie 渲染） */
if(!/(^|;)\s*tz=/.test(document.cookie)){try{var z=Intl.DateTimeFormat().resolvedOptions().timeZone;if(z){document.cookie='tz='+encodeURIComponent(z)+';path=/;max-age=31536000;SameSite=Lax';location.reload()}}catch(e){}}</script>
</head>{{end}}

{{define "nav"}}<nav class="nav">
<a href="/" class="{{if eq .Path "/"}}on{{end}}">大盘</a>
<a href="/accounts" class="{{if eq .Path "/accounts"}}on{{end}}">账号</a>
<a href="/alerts" class="{{if eq .Path "/alerts"}}on{{end}}">告警</a>
<a href="/logs" class="{{if eq .Path "/logs"}}on{{end}}">日志</a>
<a href="/channels" class="{{if eq .Path "/channels"}}on{{end}}">通道</a>
<a href="/settings" class="{{if eq .Path "/settings"}}on{{end}}">设置</a>
<span class="grow"></span>
<span class="dim" title="页面时间按此时区展示（设置页可改）">{{.TZName}}</span>
<span class="dim">v{{.Version}}</span>
<a href="/logout">退出</a>
</nav>
{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}{{end}}
